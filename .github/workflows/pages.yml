name: Deploy GitHub Pages

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CI: "true"

jobs:
  build:
    name: Test and build
    # Ignore pushes to feature branches; their pull requests run the same checks.
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24 and npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run converter and UI regression tests
        run: npm test

      - name: Build static website with portable asset paths
        run: npm run build -- --base=./

      - name: Verify HTML and local conversion engine are present
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -type f -name '*.wasm' -print -quit)"

      # No PR artifact can be accidentally deployed: upload only on default-branch runs.
      - name: Upload only the built website
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages
          path: dist
          retention-days: 7

  deploy:
    name: Publish GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job receives the minimum permissions needed for Pages + OIDC.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages

      - name: Write deployment link to run summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: printf '### XAVATAR-web\n\nWebsite deployed to %s\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
